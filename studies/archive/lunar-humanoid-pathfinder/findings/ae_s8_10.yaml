observation: 'Section 5 presents three answers to the counter-case ("why do high-autonomy
  humanoids need human supervision?") focused on OOD failure, consequence asymmetry,
  and the Lunokhod bidirectional lesson. The section takes the brief''s instruction
  to "seriously address the counter-case" seriously for the technical arguments, but
  misses the most economically consequential version: the cost of the forward-deployed
  crew. A 4-person permanent crew at a lunar far-side base represents an order-of-magnitude
  more program cost than robotic-only operations, and the counter-case in its strongest
  form is not "autonomy handles OOD well" but "the cost of crew makes the human value
  floor prohibitively expensive; better to accept higher autonomous failure rates
  than pay for permanent crew." This is a program-level argument, not a technical
  performance argument, and it is the version that will appear in program reviews
  and budget discussions. The study takes the forward-deployment commitment as load-bearing,
