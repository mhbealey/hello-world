fix: 'Trace the 1.5 events/shift estimate to the §02-03 task taxonomy. Specify which
  tasks drive this estimate and at what operational tempo they occur. If first-execution
  events are uncommon after an initial commissioning period, the continuous supervision
  demand should be stated as a function of phase (higher during commissioning, lower
  during steady-state operations) rather than a single flat estimate.


