observation: '"The Mir Mission Chronicle establishes the baseline: across 28 long-duration
  expeditions (1986–2000), approximately 30–40% of crew time went to unscheduled maintenance
  and repair, 20–30% to scheduled science, 15% to mandatory exercise (two hours daily),
  and 25–35% to communications, documentation, housekeeping, and personal time. \cite{kanas2008space}"
  The text explicitly names "Mir Mission Chronicle" as the source ("The Mir Mission
  Chronicle establishes the baseline") and then cites `kanas2008space` (Kanas & Manzey
  2008, Space Psychology and Psychiatry). These are two different documents. The NASA
  Mir Mission Chronicle is NASA TP-98-207890 (Portree & Trevino, 1999), a primary
  institutional record of Mir operations. Kanas & Manzey is a textbook on space psychology.
  The 30–40% maintenance figure and the crew time breakdown given are more characteristic
  of an operational chronicle than a psychology textbook. Web search did not find
  the 30–40% figure attributed specifically to Kanas & Man'
