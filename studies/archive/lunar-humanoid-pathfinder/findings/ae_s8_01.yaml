observation: '"Earth-to-Queqiao-2 at apoapsis: approximately 384,400 + 16,500 = ~400,900
  km from Earth center, yielding OWLT of 400,900 ÷ 299,792 = **1.337 s**" The derivation
  assumes Queqiao-2 is positioned radially outward from Earth on the Earth-Moon centerline
  (i.e., directly behind the Moon as seen from Earth). This is not the orbital geometry
  required for simultaneous Earth and far-side line-of-sight. For the satellite to
  see both Earth and the far side simultaneously, it must be above the lunar limb
  — not on the anti-Earth axis — which means the Earth-to-satellite slant range is
  approximately the Earth-Moon distance, not Earth-Moon + altitude. The geometry that
  makes far-side coverage possible is precisely the geometry where the satellite''s
  altitude above the Moon adds only minimally to the Earth-satellite range.


  More precisely: Queqiao-2 at apoapsis above the lunar limb is roughly 384,400 km
  from Earth (the Earth-Moon distance) plus a projection of the satellite''s orbital
