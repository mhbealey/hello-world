observation: 'Each supervision mode subsection in Section 1 contains a "Required for"
  list that names specific tasks from the 20-task taxonomy (e.g., "T09 (EVA tool handoff
  to crew)", "T02 (unstructured terrain with human path approval)"). This list fully
  duplicates the Task Allocation Table in §02-03 Section 4, which is the authoritative
  source for mode assignments. Section 1''s job is to define the modes and their properties;
  the task assignments are a §02-03 output. The duplication is not incorrect — it
  aids readability — but it adds approximately 200 words and creates a maintenance
  dependency: when the task allocation changes, both tables must be updated simultaneously.'
