observation: 'The §02-04 derivation and the §A19 derivation give the same answer (8
  person-hours) via two different paths that contradict each other.


  §02-04 path: 4 crew × 8 hr/shift × 0.25 fraction = 8 person-hours. This implies
  each crew member contributes 2 person-hours of supervisory capacity from an 8-hour
  shift.


  §A19 path: fraction available for supervision = 25–30% → "approximately 3 hours
  per crew member per shift" (3 hours is 37.5% of an 8-hour shift, not 25–30%). Then
  §A19 states "4 × 2 hours ≈ 8 person-hr/shift" — reverting to 2 hours/crew member
  despite the preceding sentence saying 3 hours/crew member. The paragraph is internally
  contradictory: it states 3 hours per crew member and then multiplies by 2 hours
  per crew member.


  Furthermore, the §02-04 arithmetic omits a critical element: the section uses an
  8-hour work shift, but Mir crews worked a 12-hour waking day with roughly half dedicated
  to scheduled activities. If the base operates on a 12-hour waking day with 8 hours
  of schedul'
impact: See finding.
