observation: '"Navigation — 3D mapping, terrain avoidance: Current Space TRL 8. Space
  TRL 8: Mars AutoNav (Curiosity, Perseverance) is the unambiguous heritage — stereo-camera-derived
  point-cloud terrain classification and path planning, operating autonomously since
  2012." The TRL 8 claim is defensible for the AutoNav algorithm in the specific application
  of wheeled rover navigation on Mars, but it is presented in a table column titled
  "Current Space TRL" for the general task category "Navigation — 3D mapping, terrain
  avoidance" in the context of a bipedal humanoid on the lunar surface. This is not
  a TRL for the mission application; it is a TRL for a related but different application
  (wheeled rover, different gravity, different surface, different platform kinematics).
  The notes column partially hedges this ("gap is speed and platform"), but the TRL
  8 entry in the "Current Space TRL" column will be read by downstream agents as meaning
  the capability is 95%+ demonstrated for the application at hand. T'
