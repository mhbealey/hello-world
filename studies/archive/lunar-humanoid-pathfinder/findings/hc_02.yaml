observation: '"Queqiao-2 occupies an elliptical frozen orbit around the Moon with
  a periapsis of approximately 200–250 km and an apoapsis of approximately 16,000–17,000
  km above the lunar surface, with an orbital period of approximately 24 hours and
  an inclination of 62.4°." Independent astronomer Scott Tilley determined in September
  2024 that Queqiao-2 entered a retrograde orbit with inclination approximately 119.25°
  and dimensions approximately 254 × 16,941 km — not the planned 62.4° prograde frozen
  orbit of 200 × 16,000 km. This is not a small rounding difference; the inclination
  differs by 57 degrees and the orbit is retrograde rather than prograde. The satellite
  is confirmed operational (successfully relayed for Chang''e-4 and Chang''e-6) so
  the change does not invalidate the relay function, but the claimed orbital parameters
  — specifically the 62.4° inclination — are the pre-launch design specification,
  not the confirmed operational state. The latency calculations in §02-02 are not
