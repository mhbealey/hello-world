$schema: "https://json-schema.org/draft/2020-12/schema"
title: "System Observation"
description: "Schema for a single meta-supervisor observation entry."
type: object
required: [observation_id, study_id, cycle_id, date, observations, lessons_delta, trend, recommendations]
additionalProperties: false
properties:
  observation_id:
    type: string
    description: "Unique ID e.g. orbital-01-cycle-01 or lunar-stage-05"
  study_id:
    type: string
  cycle_id:
    type: ["string", "integer"]
    description: "Cycle number or stage identifier"
  date:
    type: string
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
  source:
    type: string
    description: "Path to handback or retro file this observation was derived from"
  observations:
    type: object
    required: [worked, failed]
    additionalProperties: false
    properties:
      worked:
        type: array
        items:
          type: string
        minItems: 1
      failed:
        type: array
        items:
          type: string
  lessons_delta:
    type: array
    description: "New lessons learned this cycle, not present in prior cycles"
    items:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text:
          type: string
        lesson_id:
          type: string
  trend:
    type: string
    enum: [improving, flat, regressing]
    description: "System quality trend across last three cycles"
  recommendations:
    type: array
    description: "Concrete recommendations for the next cycle"
    items:
      type: string
    minItems: 1
