$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Reviewer Finding"
description: "Schema for a single finding produced by any of the six reviewers."
type: object
required: [finding_id, reviewer, severity, study_id, cycle, file_path, observation, impact, fix]
additionalProperties: false
properties:
  finding_id:
    type: string
    description: "Reviewer-namespaced ID. e.g. AE-001, HC-003, RM-B01, RM-Nit01. Must start with uppercase letter."
    minLength: 3
  reviewer:
    type: string
    enum:
      - aerospace-engineer-reviewer
      - heritage-citations-reviewer
      - reliability-margins-reviewer
      - cross-coupling-reviewer
      - devils-advocate-reviewer
      - scope-discipline-reviewer
      - visual-review-agent
      - visual-coupling-agent
  severity:
    type: string
    enum: [Blocker, Major, Minor, Nit]
  study_id:
    type: string
  cycle:
    oneOf:
      - type: integer
        description: "Cycle number as integer for v1.0+ studies. Use this for all new studies."
      - type: string
        pattern: "^stage-\\d+$"
        description: "Legacy pre-v1.0 format only (e.g. stage-8). Do not use for new studies."
    description: "Cycle identifier. New studies must use integer (e.g. 1, 2, 3). Bare strings like '01' are invalid."
  file_path:
    type: string
  section:
    type: ["string", "null"]
  observation:
    type: string
  impact:
    type: string
  fix:
    type: string
  status:
    type: string
    enum: [open, resolved, deferred, wont-fix]
    default: open
  resolution_notes:
    type: ["string", "null"]
  date_found:
    type: string
  date_resolved:
    type: ["string", "null"]
