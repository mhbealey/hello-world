- observation_id: 01-orbital-platform-cycle-1
  study_id: 01-orbital-platform
  cycle_id: 1
  date: '2026-05-07'
  source: studies/active/01-orbital-platform/cycles/cycle-01/handback.md
  observations:
    worked:
    - The base/overlay agent split (compose.py) correctly separates domain-neutral
      methodology from study-specific data. The orbital-platform overlays are materially
      different from the lunar-surface overlays — the split is load-bearing, not cosmetic.
    - Seeding cross_coupling.yaml before analysis begins ensures Cycle 2 agents work
      from consistent shared state, not independently derived numbers that drift.
    - The heritage-baseline-first sequencing correctly establishes what is solved
      (docking, attitude control) vs. what is genuinely new (traffic management, propellant
      depot at scale). This prevents the study from spending 80% of its word count
      defending TRL 9 systems.
    failed:
    - The commercial case (§A1) is the existential risk. Cost-program must engage
      this honestly — a study that assumes $100/kg Starship without documenting the
      risk of $1,000/kg is not credible.
    - The debris scaling problem (§A11) may be a hard constraint. fault-management-sustainment
      must engage this before Cycle 2 closes; if the cross-section area problem has
      no tractable engineering solution, the 1 km scale target must be revisited.
    - Word budgets are tight (3,000 words per main question agent). Agents must cut
      — the failure mode is verbose background sections. Every sentence must either
      establish a position or defend one.
  lessons_delta:
  - text: The commercial case (§A1) is the existential risk. Cost-program must engage
      this honestly — a study that assumes $100/kg Starship without documenting the
      risk of $1,000/kg is not credible.
  - text: The debris scaling problem (§A11) may be a hard constraint. fault-management-sustainment
      must engage this before Cycle 2 closes; if the cross-section area problem has
      no tractable engineering solution, the 1 km scale target must be revisited.
  - text: Word budgets are tight (3,000 words per main question agent). Agents must
      cut — the failure mode is verbose background sections. Every sentence must either
      establish a position or defend one.
  trend: flat
  recommendations:
  - '[ ] Founder decision: orbital inclination → set `orbital_inclination` in cross_coupling.yaml'
  - '[ ] Founder decision: interface standard strategy → set `interface_standard_strategy`'
  - '[ ] Founder decision: manufacturing product line → set `primary_manufacturing_product`'
  - '[ ] Read `cycles/cycle-02/scaffold.md` to confirm agent assignments'
  - '[ ] All 12 §A assumptions reviewed — no objections to stated risk levels'
- observation_id: lunar-humanoid-stage-04
  study_id: lunar-humanoid-pathfinder
  cycle_id: stage4
  date: '2026-05-03'
  source: studies/archive/lunar-humanoid-pathfinder/handbacks/handback-stage4.md
  observations:
    worked:
    - Base agent library dispatched and produced structured drafts for all Question
      (a) subsections.
    - Heritage-research-agent and humanoid-systems-architect ran in parallel with
      write isolation via separate stub bib files.
    failed:
    - Breadcrumb files scaffolded but not populated — session logs, cross-coupling
      log, and retro files were empty through stage 4.
    - Assumption registry had two contradicting autonomy TRL entries simultaneously
      for an entire cycle; conflict undetected until stage 5 handback.
    - Review agents scaffolded but never invoked — zero-findings count is a false
      signal, not a clean bill of health.
  lessons_delta:
  - text: Breadcrumb discipline does not happen by being scaffolded; enforcement must
      be a blocking gate.
  - text: Zero findings without evidence that reviews ran is misleading, not a success
      signal.
  - text: Contradictions in the assumption registry compound silently across stages.
  trend: flat
  recommendations:
  - Add mandatory closing actions checklist to every agent file.
  - 'Implement blocking gate: agent cannot declare complete without session log entry.'
  - Dispatch review agents in stage 5 before any new content is added.
- observation_id: lunar-humanoid-stage-05
  study_id: lunar-humanoid-pathfinder
  cycle_id: stage5
  date: '2026-05-03'
  source: studies/archive/lunar-humanoid-pathfinder/handbacks/handback-stage5.md
  observations:
    worked:
    - Retroactive breadcrumb reconstruction captured all stage 2–4 decisions for the
      record.
    - Mandatory closing actions added to all agent files; pre-handback checklist enforced.
    - Cross-coupling log seeded with 13 entries covering all prior decisions.
    failed:
    - Retroactive reconstruction is acknowledged unreliable — the record represents
      the orchestrator's best reconstruction, not contemporaneous logging.
    - Citation keys added without corresponding BibTeX entries; corpus has ~22 missing
      reference entries.
  lessons_delta:
  - text: Retroactive reconstruction is possible but produces unreliable records;
      real-time enforcement is the only solution.
  - text: Agent prompts must require BibTeX entry creation alongside every inline
      citation key added.
  trend: improving
  recommendations:
  - Run CitationIntegrityGate before stage 6 dispatch; block on missing BibTeX entries.
  - Treat retroactively-reconstructed retro artifacts as lower-confidence sources.
- observation_id: lunar-humanoid-stage-06
  study_id: lunar-humanoid-pathfinder
  cycle_id: stage6
  date: '2026-05-03'
  source: studies/archive/lunar-humanoid-pathfinder/handbacks/handback-stage6.md
  observations:
    worked:
    - First real review pass ran; six reviewers produced structured findings.
    - CitationIntegrityGate detected 22 missing BibTeX entries — gate caught what
      agent discipline missed.
    - '[VERIFY] flag discipline adopted by heritage agents; gaps identified in engineering
      agent outputs.'
    failed:
    - '[VERIFY] flag used inconsistently — concentrated in heritage files, absent
      from engineering analysis sections despite specific TRL claims that require
      verification.'
    - Word budgets breached in two of six Question (a) sections.
  lessons_delta:
  - text: Gates are more reliable than agent discipline; gates must enforce what conventions
      only recommend.
  - text: Inline uncertainty flags ([VERIFY], [EST]) must be required for all numeric
      claims not from direct primary source citation.
  trend: improving
  recommendations:
  - Add [VERIFY]/[EST] requirement to all agent dispatch prompts for stage 7.
  - Enforce word budget cap as a blocking gate, not a soft warning.
